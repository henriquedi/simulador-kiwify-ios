<body class="bg-black flex items-center justify-center min-h-screen font-sans text-zinc-100 selection:bg-green-500/30 p-4">
  
  <div class="relative w-full max-w-[400px] h-[850px] max-h-[95vh] bg-zinc-950 shadow-2xl overflow-hidden rounded-[2.5rem] border-[6px] border-zinc-800 flex flex-col">
    
    <!-- Fake StatusBar -->
    <div class="absolute top-0 inset-x-0 h-7 flex justify-between items-center px-6 text-[10px] font-medium text-zinc-400 z-50 pointer-events-none">
      <span>9:41</span>
      <div class="flex gap-1.5 items-center">
        <i data-lucide="shield-alert" class="w-3 h-3"></i>
        <i data-lucide="zap" class="w-3 h-3"></i>
      </div>
    </div>

    <!-- ========================================================= -->
    <!-- TELA 1: AUTENTICAÇÃO (ENTRAR / CADASTRAR)                 -->
    <!-- ========================================================= -->
    <div id="auth-screen" class="flex-1 overflow-y-auto pt-12 pb-10 px-6 no-scrollbar flex flex-col justify-center">
      
      <div class="flex flex-col items-center mb-8">
        <div class="w-16 h-16 rounded-full flex items-center justify-center shadow-[0_0_25px_rgba(34,197,94,0.35)] mb-3 overflow-hidden bg-green-500">
          <img id="auth-logo-img" alt="Kiwify Logo" class="w-full h-full object-cover" />
        </div>
        <h1 class="text-2xl font-bold tracking-tight">Kiwify</h1>
        <p class="text-xs text-zinc-500 mt-1">Acesse sua conta para continuar</p>
      </div>

      <div class="bg-zinc-900 p-1.5 rounded-2xl flex relative h-12 items-center mb-6">
        <div id="auth-tab-slider" class="absolute h-9 w-[calc(50%-6px)] bg-zinc-800 rounded-xl transition-transform duration-300 ease-out shadow-sm translate-x-0"></div>
        <button id="tab-login" type="button" class="flex-1 relative z-10 font-semibold text-sm transition-colors text-white">Entrar</button>
        <button id="tab-register" type="button" class="flex-1 relative z-10 font-semibold text-sm transition-colors text-zinc-500">Cadastrar</button>
      </div>

      <div id="auth-alert" class="hidden mb-4 p-3 rounded-xl text-xs font-medium border"></div>

      <form id="form-login" class="space-y-4">
        <div>
          <label class="block text-xs font-medium text-zinc-400 mb-1.5">Gmail</label>
          <div class="relative">
            <i data-lucide="mail" class="w-4 h-4 text-zinc-500 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
            <input id="login-email" type="email" required placeholder="seunome@gmail.com" class="w-full bg-zinc-900 border border-zinc-800 rounded-xl pl-10 pr-4 py-3 text-sm text-white focus:outline-none focus:border-green-500 transition-colors" />
          </div>
        </div>

        <div>
          <label class="block text-xs font-medium text-zinc-400 mb-1.5">Senha</label>
          <div class="relative">
            <i data-lucide="lock" class="w-4 h-4 text-zinc-500 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
            <input id="login-password" type="password" required placeholder="Digite sua senha" class="w-full bg-zinc-900 border border-zinc-800 rounded-xl pl-10 pr-4 py-3 text-sm text-white focus:outline-none focus:border-green-500 transition-colors" />
          </div>
        </div>

        <button type="submit" class="w-full bg-green-500 text-white hover:bg-green-600 shadow-[0_0_15px_rgba(34,197,94,0.3)] py-3.5 rounded-xl font-semibold text-sm transition-all active:scale-[0.98] mt-2">
          Entrar na Conta
        </button>
      </form>

      <form id="form-register" class="hidden space-y-4">
        <div>
          <label class="block text-xs font-medium text-zinc-400 mb-1.5">Gmail (obrigat&oacute;rio @gmail.com)</label>
          <div class="relative">
            <i data-lucide="mail" class="w-4 h-4 text-zinc-500 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
            <input id="reg-email" type="email" required placeholder="seunome@gmail.com" class="w-full bg-zinc-900 border border-zinc-800 rounded-xl pl-10 pr-4 py-3 text-sm text-white focus:outline-none focus:border-green-500 transition-colors" />
          </div>
        </div>

        <div>
          <label class="block text-xs font-medium text-zinc-400 mb-1.5">Celular com DDD</label>
          <div class="relative">
            <i data-lucide="phone" class="w-4 h-4 text-zinc-500 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
            <input id="reg-phone" type="tel" required placeholder="(37) 99999-9999" maxlength="15" class="w-full bg-zinc-900 border border-zinc-800 rounded-xl pl-10 pr-4 py-3 text-sm text-white focus:outline-none focus:border-green-500 transition-colors" />
          </div>
        </div>

        <div>
          <label class="block text-xs font-medium text-zinc-400 mb-1.5">Senha (m&iacute;nimo 6 caracteres)</label>
          <div class="relative">
            <i data-lucide="lock" class="w-4 h-4 text-zinc-500 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
            <input id="reg-password" type="password" required minlength="6" placeholder="Crie uma senha" class="w-full bg-zinc-900 border border-zinc-800 rounded-xl pl-10 pr-4 py-3 text-sm text-white focus:outline-none focus:border-green-500 transition-colors" />
          </div>
        </div>

        <button type="submit" class="w-full bg-green-500 text-white hover:bg-green-600 shadow-[0_0_15px_rgba(34,197,94,0.3)] py-3.5 rounded-xl font-semibold text-sm transition-all active:scale-[0.98] mt-2">
          Criar Conta
        </button>
      </form>
    </div>

    <!-- ========================================================= -->
    <!-- TELA 2: APLICATIVO PRINCIPAL (SIMULADOR KIWIFY)           -->
    <!-- ========================================================= -->
    <div id="app-screen" class="hidden flex-1 flex flex-col overflow-hidden">
      
      <div class="pt-8 pb-2.5 px-5 bg-zinc-950/90 border-b border-zinc-900 flex items-center justify-between gap-2 shrink-0">
        <div class="flex items-center gap-2 min-w-0">
          <div class="w-2 h-2 rounded-full bg-green-500 shrink-0"></div>
          <span id="logged-user-email" class="text-[11px] text-zinc-400 truncate"></span>
        </div>
        <button id="btn-logout" title="Sair da conta" class="flex items-center gap-1 bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 text-zinc-400 hover:text-red-400 px-2.5 py-1 rounded-lg text-[11px] font-medium transition-colors shrink-0">
          <i data-lucide="log-out" class="w-3 h-3"></i> Sair
        </button>
      </div>

      <div class="flex-1 overflow-y-auto pb-8 pt-4 no-scrollbar px-5">

            </div>
          </div>

          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-medium text-zinc-400 mb-1.5">Quantas vezes</label>

              <input id="inp-interval" type="number" min="1" value="3" class="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-green-500 transition-colors" />

          <div class="bg-zinc-900 p-1.5 rounded-2xl flex relative h-14 items-center cursor-pointer">
            <div id="currency-slider" class="absolute h-11 w-[calc(50%-6px)] bg-zinc-800 rounded-xl transition-transform duration-300 ease-out shadow-sm translate-x-0"></div>
            <button id="btn-brl" class="flex-1 relative z-10 font-semibold text-sm transition-colors text-white">Real (BRL)</button>
            <button id="btn-usd" class="flex-1 relative z-10 font-semibold text-sm transition-colors text-zinc-500">D&oacute;lar (USD)</button>
          </div>

          <div>
            <label class="block text-sm font-medium text-zinc-400 mb-1.5">M&eacute;todo de pagamento</label>
            <div class="relative">
              <select id="inp-method" class="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-4 py-3.5 text-white focus:outline-none focus:border-green-500 focus:ring-1 focus:ring-green-500 appearance-none font-medium">
                <option value="Pix">Pix</option>
                <option value="Cart&atilde;o de Cr&eacute;dito">Cart&atilde;o de Cr&eacute;dito</option>
                <option value="Boleto">Boleto</option>
              </select>
              <div class="absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-zinc-500">▼</div>
            </div>
          </div>

          <hr class="border-zinc-800" />

          <div class="space-y-3 bg-zinc-900/50 border border-zinc-800/50 p-4 rounded-2xl">
            <div class="flex items-center gap-2 mb-2">
              <i data-lucide="smartphone" class="text-zinc-400 w-4 h-4"></i>
              <h3 class="text-sm font-semibold text-zinc-300">Notifica&ccedil;&otilde;es do Aparelho</h3>
            </div>
            <button id="btn-native-enable" class="w-full bg-zinc-800 text-zinc-200 hover:bg-zinc-700 flex items-center justify-center gap-2 px-4 py-3.5 rounded-xl font-semibold transition-all active:scale-[0.98]">
              Ativar notifica&ccedil;&otilde;es do aparelho
            </button>
            <button id="btn-native-test" class="w-full bg-zinc-800 text-zinc-200 hover:bg-zinc-700 flex items-center justify-center gap-2 px-4 py-3.5 rounded-xl font-semibold transition-all active:scale-[0.98]">
              Enviar notifica&ccedil;&atilde;o de teste
            </button>
          </div>
        </div>
      </div>

      <div class="p-5 bg-zinc-950 border-t border-zinc-900">
        <button id="btn-start" class="w-full bg-green-500 text-white hover:bg-green-600 shadow-[0_0_15px_rgba(34,197,94,0.3)] flex items-center justify-center gap-2 px-4 py-4 rounded-2xl font-semibold text-lg transition-all active:scale-[0.98]">
          <i data-lucide="play" class="w-5 h-5 fill-current"></i> Iniciar Disparos
        </button>
        
        <div id="running-state" class="hidden space-y-3">
          <div class="flex justify-between items-center px-2">
            <span class="text-sm font-medium text-green-500 animate-pulse flex items-center gap-2">
              <div class="w-2 h-2 rounded-full bg-green-500"></div>
              Rodando...
            </span>
            <span id="progress-text" class="text-sm font-bold bg-zinc-900 px-3 py-1 rounded-full text-zinc-300">
              0 / 5
            </span>
          </div>
          <button id="btn-stop" class="w-full bg-red-500/10 text-red-500 border border-red-500/20 hover:bg-red-500/20 flex items-center justify-center gap-2 px-4 py-4 rounded-2xl font-semibold text-lg transition-all active:scale-[0.98]">
            <i data-lucide="square" class="w-5 h-5 fill-current"></i> Parar Agora
          </button>
        </div>
      </div>

    </div>
    
    <div class="absolute bottom-2 inset-x-0 h-1 flex justify-center pointer-events-none z-50">
      <div class="w-1/3 bg-white/20 rounded-full"></div>
    </div>

  </div>

  <script>
    lucide.createIcons();
    document.getElementById('main-logo-img').src = currentLogoURI;
    document.getElementById('auth-logo-img').src = currentLogoURI;

    // Helper para acessar o plugin nativo do Capacitor (iOS / Android)
    const getNativeNotifications = () => {
      if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.LocalNotifications) {
        return window.Capacitor.Plugins.LocalNotifications;
      }
      return null;
    };

    // =========================================================
    // SISTEMA DE AUTENTICAÇÃO (LOCALSTORAGE)
    // =========================================================
    const authScreen = document.getElementById('auth-screen');
    const appScreen = document.getElementById('app-screen');
    const authTabSlider = document.getElementById('auth-tab-slider');
    const tabLogin = document.getElementById('tab-login');
    const tabRegister = document.getElementById('tab-register');
    const formLogin = document.getElementById('form-login');
    const formRegister = document.getElementById('form-register');
    const authAlert = document.getElementById('auth-alert');
    const loggedUserEmail = document.getElementById('logged-user-email');

    const getUsers = () => JSON.parse(localStorage.getItem('kiwify_users') || '[]');
    const saveUsers = (users) => localStorage.setItem('kiwify_users', JSON.stringify(users));

    const showAlert = (msg, type = 'error') => {
      authAlert.classList.remove(
        'hidden',
        'bg-red-500/10', 'border-red-500/30', 'text-red-400',
        'bg-green-500/10', 'border-green-500/30', 'text-green-400'
      );
      if (type === 'success') {
        authAlert.classList.add('bg-green-500/10', 'border-green-500/30', 'text-green-400');
      } else {
        authAlert.classList.add('bg-red-500/10', 'border-red-500/30', 'text-red-400');
      }
      authAlert.innerHTML = msg;
    };

    const hideAlert = () => authAlert.classList.add('hidden');

    const switchAuthTab = (tab, keepAlert = false) => {
      if (!keepAlert) hideAlert();
      if (tab === 'login') {
        authTabSlider.style.transform = 'translateX(0)';
        tabLogin.classList.replace('text-zinc-500', 'text-white');
        tabRegister.classList.replace('text-white', 'text-zinc-500');
        formLogin.classList.remove('hidden');
        formRegister.classList.add('hidden');
      } else {
        authTabSlider.style.transform = 'translateX(100%)';
        tabRegister.classList.replace('text-zinc-500', 'text-white');
        tabLogin.classList.replace('text-white', 'text-zinc-500');
        formRegister.classList.remove('hidden');
        formLogin.classList.add('hidden');
      }
    };

    tabLogin.onclick = () => switchAuthTab('login');
    tabRegister.onclick = () => switchAuthTab('register');

    const phoneInput = document.getElementById('reg-phone');
    phoneInput.addEventListener('input', (e) => {
      let v = e.target.value.replace(/\D/g, '').slice(0, 11);
      if (v.length > 6) {
        v = `(${v.slice(0, 2)}) ${v.slice(2, 7)}-${v.slice(7)}`;
      } else if (v.length > 2) {
        v = `(${v.slice(0, 2)}) ${v.slice(2)}`;
      } else if (v.length > 0) {
        v = `(${v}`;
      }
      e.target.value = v;
    });

    const isValidGmail = (email) => /^[a-zA-Z0-9._%+-]+@gmail\.com$/i.test(email.trim());

    const openApp = (email) => {
      loggedUserEmail.innerText = email;
      authScreen.classList.add('hidden');
      appScreen.classList.remove('hidden');
      lucide.createIcons();
    };

    const openAuth = () => {
      appScreen.classList.add('hidden');
      authScreen.classList.remove('hidden');
      switchAuthTab('login');
      lucide.createIcons();
    };

    const activeSession = localStorage.getItem('kiwify_session');
    if (activeSession) {
      openApp(activeSession);
    } else {
      openAuth();
    }

    formRegister.onsubmit = (e) => {
      e.preventDefault();
      hideAlert();

      const email = document.getElementById('reg-email').value.trim().toLowerCase();
      const phone = phoneInput.value.trim();
      const password = document.getElementById('reg-password').value;

      if (!isValidGmail(email)) {
        return showAlert('Informe um endere&ccedil;o v&aacute;lido terminando em <strong>@gmail.com</strong>.');
      }
      if (phone.replace(/\D/g, '').length < 10) {
        return showAlert('Informe um n&uacute;mero de celular v&aacute;lido com DDD.');
      }
      if (password.length < 6) {
        return showAlert('A senha precisa ter no m&iacute;nimo 6 caracteres.');
      }

      const users = getUsers();
      if (users.some(u => u.email === email)) {
        return showAlert('Este Gmail j&aacute; est&aacute; cadastrado. Use a aba <strong>Entrar</strong>.');
      }

      users.push({ email, phone, password, createdAt: new Date().toISOString() });
      saveUsers(users);
      formRegister.reset();

      document.getElementById('login-email').value = email;
      document.getElementById('login-password').value = '';
      showAlert('Conta criada com sucesso! Digite sua senha para entrar.', 'success');
      switchAuthTab('login', true);
      document.getElementById('login-password').focus();
    };

    formLogin.onsubmit = (e) => {
      e.preventDefault();
      hideAlert();

      const email = document.getElementById('login-email').value.trim().toLowerCase();
      const password = document.getElementById('login-password').value;

      if (!isValidGmail(email)) {
        return showAlert('Use um endere&ccedil;o <strong>@gmail.com</strong> v&aacute;lido.');
      }

      const users = getUsers();
      const user = users.find(u => u.email === email && u.password === password);

      if (!user) {
        return showAlert('Gmail ou senha incorretos. Se ainda n&atilde;o tem conta, clique em <strong>Cadastrar</strong>.');
      }

      localStorage.setItem('kiwify_session', user.email);
      document.getElementById('login-password').value = '';
      openApp(user.email);
    };

    document.getElementById('btn-logout').onclick = () => {
      stop();
      localStorage.removeItem('kiwify_session');
      openAuth();
    };

    // =========================================================
    // LÓGICA DO SIMULADOR KIWIFY + NOTIFICAÇÕES NATIVAS
    // =========================================================
    const logoUploadInp = document.getElementById('logo-upload');
    const logoBtn = document.getElementById('logo-btn');
    
    logoBtn.onclick = () => logoUploadInp.click();
    
    logoUploadInp.onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      
      const reader = new FileReader();
      reader.onload = (event) => {
        const base64Str = event.target.result;
        currentLogoURI = base64Str;
        localStorage.setItem('kiwify_custom_logo', base64Str);
        
        document.getElementById('main-logo-img').src = base64Str;
        document.getElementById('auth-logo-img').src = base64Str;
        document.getElementById('dynamic-favicon').href = base64Str;
        
        alert("Sua imagem foi salva no aplicativo com sucesso!");
      };
      reader.readAsDataURL(file);
    };

    let settings = { value: '97,00', count: 5, interval: 3, currency: 'BRL', method: 'Pix' };
    let isRunning = false;
    let timerId = null;
    let currentProgress = 0;

    const el = {
      val: document.getElementById('inp-value'),
      count: document.getElementById('inp-count'),
      interval: document.getElementById('inp-interval'),
      method: document.getElementById('inp-method'),
      btnBrl: document.getElementById('btn-brl'),
      btnUsd: document.getElementById('btn-usd'),
      slider: document.getElementById('currency-slider'),
      sym: document.getElementById('currency-symbol'),
      btnStart: document.getElementById('btn-start'),
      btnStop: document.getElementById('btn-stop'),
      runningState: document.getElementById('running-state'),
      progressText: document.getElementById('progress-text'),
      btnNativeEnable: document.getElementById('btn-native-enable'),
      btnNativeTest: document.getElementById('btn-native-test'),
    };

    const setCurrency = (curr) => {
      settings.currency = curr;
      if (curr === 'BRL') {
        el.slider.style.transform = 'translateX(0)';
        el.btnBrl.classList.replace('text-zinc-500', 'text-white');
        el.btnUsd.classList.replace('text-white', 'text-zinc-500');
        el.sym.innerText = 'R$';
      } else {
        el.slider.style.transform = 'translateX(100%)';
        el.btnUsd.classList.replace('text-zinc-500', 'text-white');
        el.btnBrl.classList.replace('text-white', 'text-zinc-500');
        el.sym.innerText = 'US$';
      }
    };

    el.btnBrl.onclick = () => setCurrency('BRL');
    el.btnUsd.onclick = () => setCurrency('USD');

    const updatePermissionUI = async () => {
      const nativeNotif = getNativeNotifications();
      if (nativeNotif) {
        try {
          const perm = await nativeNotif.checkPermissions();
          if (perm.display === 'granted') {
            el.btnNativeEnable.innerHTML = `<i data-lucide="check" class="w-4 h-4 text-green-500"></i> Aparelho Ativado`;
            lucide.createIcons();
          }
        } catch (e) {}
      } else if ('Notification' in window && Notification.permission === 'granted') {
        el.btnNativeEnable.innerHTML = `<i data-lucide="check" class="w-4 h-4 text-green-500"></i> Aparelho Ativado`;
        lucide.createIcons();
      }
    };
    updatePermissionUI();

    const buildNotificationContent = () => {
      const curr = settings.currency === 'BRL' ? 'R$' : 'US$';
      const method = settings.method;
      const value = settings.value;

      let title = '';
      if (method === 'Pix') {
        const pixOpcoes = ["Pix gerado!", "Venda aprovada!"];
        title = pixOpcoes[Math.floor(Math.random() * pixOpcoes.length)];
      } else if (method === 'Cartão de Crédito') {
        title = "Venda aprovada!";
      } else if (method === 'Boleto') {
        const boletoOpcoes = ["Boleto gerado!", "Venda aprovada!"];
        title = boletoOpcoes[Math.floor(Math.random() * boletoOpcoes.length)];
      } else {
        title = "Venda aprovada!";
      }

      return {
        title,
        body: `Valor: ${curr}${value}`
      };
    };

    const fireNotification = async (delaySeconds = 1) => {
      const { title, body } = buildNotificationContent();
      const nativeNotif = getNativeNotifications();

      if (nativeNotif) {
        try {
          await nativeNotif.schedule({
            notifications: [
              {
                id: Math.floor(Math.random() * 2000000000),
                title,
                body,
                schedule: { at: new Date(Date.now() + delaySeconds * 1000) }
              }
            ]
          });
        } catch (e) {
          console.warn("Erro ao agendar notificação nativa", e);
        }
      } else if ('Notification' in window && Notification.permission === 'granted') {
        try {
          new Notification(title, { body, icon: currentLogoURI });
        } catch (e) {
          console.warn("Erro ao disparar nativa", e);
        }
      }
    };

    const stop = async () => {
      isRunning = false;
      clearTimeout(timerId);
      el.btnStart.classList.remove('hidden');
      el.runningState.classList.add('hidden');

      const nativeNotif = getNativeNotifications();
      if (nativeNotif) {
        try {
          const pending = await nativeNotif.getPending();
          if (pending.notifications && pending.notifications.length > 0) {
            await nativeNotif.cancel({ notifications: pending.notifications });
          }
        } catch (e) {}
      }
    };

    const runLoop = () => {
      if (!isRunning) return;
      currentProgress++;
      el.progressText.innerText = `${currentProgress} / ${settings.count}`;

      if (!getNativeNotifications()) {
        fireNotification();
      }

      if (currentProgress >= settings.count) {
        isRunning = false;
        el.btnStart.classList.remove('hidden');
        el.runningState.classList.add('hidden');
      } else {
        timerId = setTimeout(runLoop, settings.interval * 1000);
      }
    };

    el.btnStart.onclick = async () => {
      settings.value = el.val.value;
      settings.count = parseInt(el.count.value) || 1;
      settings.interval = parseInt(el.interval.value) || 1;
      settings.method = el.method.value;

      const nativeNotif = getNativeNotifications();
      if (nativeNotif) {
        const perm = await nativeNotif.checkPermissions();
        if (perm.display !== 'granted') {
          return alert("Ative as notificações primeiro clicando em 'Ativar notificações do aparelho'.");
        }

        const batch = [];
        const baseTime = Date.now();
        for (let i = 0; i < settings.count; i++) {
          const { title, body } = buildNotificationContent();
          batch.push({
            id: Math.floor(Math.random() * 2000000000),
            title,
            body,
            schedule: { at: new Date(baseTime + (i + 1) * settings.interval * 1000) }
          });
        }
        await nativeNotif.schedule({ notifications: batch });
      }

      isRunning = true;
      currentProgress = 0;
      el.btnStart.classList.add('hidden');
      el.runningState.classList.remove('hidden');
      el.progressText.innerText = `0 / ${settings.count}`;
      
      if (nativeNotif) {
        timerId = setTimeout(runLoop, settings.interval * 1000);
      } else {
        runLoop();
      }
    };

    el.btnStop.onclick = stop;

    el.btnNativeEnable.onclick = async () => {
      const nativeNotif = getNativeNotifications();
      if (nativeNotif) {
        try {
          const perm = await nativeNotif.requestPermissions();
          if (perm.display === 'granted') {
            alert("Notificações ativadas com sucesso!");
            updatePermissionUI();
          } else {
            alert("Permissão negada. Libere em Ajustes > Notificações no seu iPhone.");
          }
        } catch (e) {
          alert("Erro ao solicitar permissão: " + e.message);
        }
        return;
      }

      if (!('Notification' in window)) return alert("Seu navegador não suporta notificações.");
      const perm = await Notification.requestPermission();
      if (perm === 'granted') {
        alert("Notificações ativadas com sucesso!");
        updatePermissionUI();
      } else {
        alert("Permissão negada. Você pode precisar liberar nas configurações do seu celular.");
      }
    };

    el.btnNativeTest.onclick = async () => {
      settings.value = el.val.value;
      settings.method = el.method.value;

      const nativeNotif = getNativeNotifications();
      if (nativeNotif) {
        const perm = await nativeNotif.checkPermissions();
        if (perm.display !== 'granted') {
          return alert("Ative as notificações primeiro clicando no botão acima.");
        }
        await fireNotification(2);
        return;
      }

      if (Notification.permission !== 'granted') return alert("Ative as notificações primeiro clicando no botão acima.");
      fireNotification();
    };
  </script>
</body>
</html>
